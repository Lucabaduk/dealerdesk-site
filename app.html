<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data: blob: 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>DealerDesk</title>
<style>
:root{--ink:#14213d;--muted:#5c677d;--line:#e3e7ee;--bg:#f6f7fb;--card:#fff;--acc:#2f5bea;--ok:#1f8a5b;--warn:#b7791f;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100vh}
nav{width:210px;background:var(--ink);color:#fff;padding:18px 0;flex-shrink:0}nav h1{font-size:18px;margin:0 20px 18px;letter-spacing:.5px}
nav button{display:flex;justify-content:space-between;width:100%;background:none;border:0;color:#cdd3e0;text-align:left;padding:10px 20px;font:inherit;cursor:pointer}
nav button.on,nav button:hover{background:#22325a;color:#fff}.badge{background:var(--acc);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
td.empty{text-align:center;color:var(--muted);padding:18px}main{flex:1;padding:24px;overflow:auto}h2{margin:0 0 16px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.kpi b{display:block;font-size:24px}.kpi span{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#eef1f7;font-weight:600;color:var(--muted)}
.pill{padding:2px 8px;border-radius:10px;font-size:12px;background:#eef1f7}.pill.Available,.pill.Closed{background:#e3f4ec;color:var(--ok)}.pill.Pending{background:#fbf0dc;color:var(--warn)}.pill.Sold,.pill.Lost{background:#f8e1de;color:var(--bad)}
form.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}input,select{padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.thumb{width:64px;height:42px;object-fit:cover;border-radius:4px;background:#eef1f7;display:block}.nophoto{width:64px;height:42px;border-radius:4px;background:#eef1f7}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.3s}.toast.on{opacity:1}
@media(max-width:700px){body{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:8px}nav h1{display:none}nav button{width:auto;white-space:nowrap}main{padding:14px}table{display:block;overflow-x:auto;white-space:nowrap}.btn,input,select,nav button{min-height:44px}input,select{font-size:16px}}
@media(prefers-color-scheme:dark){:root{--ink:#e6e9f2;--muted:#9aa5bd;--line:#2c3550;--bg:#0f1424;--card:#171e33}nav{background:#0a0f1d}th{background:#1f2740}.btn.ghost{background:var(--card)}input,select{background:#0f1424;color:var(--ink)}.toast{background:#2f5bea}.pill,.thumb,.nophoto{background:#1f2740}}
</style></head><body>
<nav id="nav"><h1>DealerDesk</h1></nav><main id="main"></main><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var KEY='dealerdesk.v1';
/* Schema adapter: Grok Master Helper's data model can replace DD.schema.normalize without touching views. */
var schema={version:1,
 normalize:function(d){d=d||{};['cars','leads','bookings','deals','staff'].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[]});
  d.settings=Object.assign({dealer:'Northside Motors',currency:'USD',taxRate:6,sound:true},d.settings||{});d.schemaVersion=1;return d}};
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function sample(){var s=[{id:'s1',name:'Dana Reyes',role:'Sales Manager'},{id:'s2',name:'Marcus Lee',role:'Sales'},{id:'s3',name:'Priya Shah',role:'Service Advisor'}];
 var c=[['1HGCM82633A004352','Honda','Accord',2023,27900,14200,'Available'],['2T1BURHE0JC034567','Toyota','Corolla',2022,21500,22800,'Available'],['1FTFW1E50MFA12345','Ford','F-150',2021,38900,31000,'Pending'],['5YJ3E1EA7KF317000','Tesla','Model 3',2020,29900,41000,'Sold']]
  .map(function(a,i){return{id:'c'+(i+1),vin:a[0],make:a[1],model:a[2],year:a[3],price:a[4],mileage:a[5],status:a[6],photo:''}});
 var t=new Date().toISOString().slice(0,10);
 return schema.normalize({cars:c,staff:s,
  leads:[{id:'l1',name:'Jordan Kim',phone:'555-0101',carId:'c1',source:'Walk-in',status:'New',created:t},{id:'l2',name:'Alex Morgan',phone:'555-0144',carId:'c3',source:'Website',status:'Contacted',created:t}],
  bookings:[{id:'b1',type:'Test drive',name:'Jordan Kim',carId:'c1',when:t+'T15:00',staffId:'s2'},{id:'b2',type:'Service',name:'Sam Ortiz',carId:'',when:t+'T10:30',staffId:'s3'}],
  deals:[{id:'d1',carId:'c4',buyer:'Chris Patel',price:29000,staffId:'s1',status:'Closed',date:t},{id:'d2',carId:'c3',buyer:'Alex Morgan',price:38000,staffId:'s2',status:'Pending',date:t}]})}
function load(){try{var r=localStorage.getItem(KEY);if(r)return schema.normalize(JSON.parse(r))}catch(e){}var d=sample();d.firstRun=true;return d}
var db=load();function save(){localStorage.setItem(KEY,JSON.stringify(db))}save();
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return'&#'+c.charCodeAt(0)+';'})}
function money(n){try{return new Intl.NumberFormat('en-US',{style:'currency',currency:db.settings.currency,maximumFractionDigits:0}).format(+n||0)}catch(e){return'$'+(+n||0)}}
function car(id){return db.cars.find(function(c){return c.id===id})}function carName(id){var c=car(id);return c?c.year+' '+c.make+' '+c.model:(id?'Removed car':'—')}
function staff(id){var s=db.staff.find(function(x){return x.id===id});return s?s.name:(id?'Removed staff':'—')}
function opts(list,lab,sel,blank){return(blank?'<option value="">'+blank+'</option>':'')+list.map(function(x){return'<option value="'+esc(x.id)+'"'+(x.id===sel?' selected':'')+'>'+esc(lab(x))+'</option>'}).join('')}
var actx;function chime(){if(!db.settings.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();var o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(0.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.12,actx.currentTime+0.03);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.6);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+0.65)}catch(e){}}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1800)}
function photo(c){return c.photo?'<img class="thumb" alt="" src="'+esc(c.photo)+'">':'<div class="nophoto" aria-label="No photo"></div>'}
var views={
dashboard:{label:'Dashboard',render:function(){var closed=db.deals.filter(function(d){return d.status==='Closed'}),rev=closed.reduce(function(a,d){return a+(+d.price||0)},0);
 var inv=db.cars.filter(function(c){return c.status!=='Sold'});var by={};closed.forEach(function(d){by[d.staffId]=(by[d.staffId]||0)+(+d.price||0)});
 return'<h2>Sales dashboard</h2><div class="kpis">'+[['Revenue (closed)',money(rev)],['Cars sold',closed.length],['In stock',inv.length],['Stock value',money(inv.reduce(function(a,c){return a+(+c.price||0)},0))],['Open leads',db.leads.filter(function(l){return l.status!=='Closed'&&l.status!=='Lost'}).length],['Bookings',db.bookings.length]].map(function(k){return'<div class="kpi" data-kpi="'+esc(k[0])+'"><b>'+esc(k[1])+'</b><span>'+esc(k[0])+'</span></div>'}).join('')+'</div>'+
 '<h3>Sales by staff</h3><table><tr><th>Staff</th><th>Closed revenue</th></tr>'+db.staff.map(function(s){return'<tr><td>'+esc(s.name)+'</td><td>'+money(by[s.id]||0)+'</td></tr>'}).join('')+'</table>'}},
inventory:{label:'Inventory',count:function(){return db.cars.filter(function(c){return c.status==='Available'}).length},render:function(){
 return'<h2>Inventory</h2><form class="row" data-form="car"><input name="vin" placeholder="VIN" required maxlength="17"><input name="make" placeholder="Make" required><input name="model" placeholder="Model" required><input name="year" type="number" placeholder="Year" required><input name="price" type="number" placeholder="Price"><input name="mileage" type="number" placeholder="Mileage"><input name="photo" type="url" placeholder="Photo URL (optional)"><button class="btn">Add car</button></form>'+
 '<table><tr><th></th><th>Vehicle</th><th>VIN</th><th>Price</th><th>Mileage</th><th>Status</th><th></th></tr>'+db.cars.map(function(c){return'<tr data-car="'+esc(c.id)+'"><td>'+photo(c)+'</td><td>'+esc(c.year+' '+c.make+' '+c.model)+'</td><td>'+esc(c.vin)+'</td><td>'+money(c.price)+'</td><td>'+(+c.mileage||0).toLocaleString()+' mi</td><td><select data-act="carstatus" data-id="'+esc(c.id)+'">'+['Available','Pending','Sold'].map(function(s){return'<option'+(s===c.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td><td><button class="btn ghost" data-act="delcar" data-id="'+esc(c.id)+'">Remove</button></td></tr>'}).join('')+'</table>'}},
leads:{label:'Leads',count:function(){return db.leads.filter(function(l){return l.status==='New'}).length},render:function(){
 return'<h2>Leads</h2><form class="row" data-form="lead"><input name="name" placeholder="Name" required><input name="phone" type="tel" placeholder="Phone" pattern="[+0-9 ().\-]{7,20}" title="7–15 digits, may use + ( ) - . and spaces"><select name="carId">'+opts(db.cars,function(c){return carName(c.id)},'','Vehicle of interest')+'</select><select name="source"><option>Walk-in</option><option>Phone</option><option>Website</option><option>QR</option></select><button class="btn">Add lead</button></form>'+
 '<table><tr><th>Name</th><th>Phone</th><th>Vehicle</th><th>Source</th><th>Status</th></tr>'+db.leads.map(function(l){return'<tr><td>'+esc(l.name)+'</td><td>'+esc(l.phone)+'</td><td>'+esc(carName(l.carId))+'</td><td>'+esc(l.source)+'</td><td><select data-act="leadstatus" data-id="'+esc(l.id)+'">'+['New','Contacted','Qualified','Closed','Lost'].map(function(s){return'<option'+(s===l.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td></tr>'}).join('')+'</table>'}},
bookings:{label:'Bookings',count:function(){return db.bookings.length},render:function(){
 return'<h2>Test drives &amp; service</h2><form class="row" data-form="booking"><select name="type"><option>Test drive</option><option>Service</option></select><input name="name" placeholder="Customer" required><select name="carId">'+opts(db.cars,function(c){return carName(c.id)},'','Vehicle')+'</select><input name="when" type="datetime-local" required><select name="staffId">'+opts(db.staff,function(s){return s.name},'')+'</select><button class="btn">Book</button></form>'+
 '<table><tr><th>When</th><th>Type</th><th>Customer</th><th>Vehicle</th><th>Staff</th><th></th></tr>'+db.bookings.slice().sort(function(a,b){return a.when<b.when?-1:1}).map(function(b){return'<tr><td>'+esc(b.when.replace('T',' '))+'</td><td>'+esc(b.type)+'</td><td>'+esc(b.name)+'</td><td>'+esc(carName(b.carId))+'</td><td>'+esc(staff(b.staffId))+'</td><td><button class="btn ghost" data-act="delbooking" data-id="'+esc(b.id)+'">Done</button></td></tr>'}).join('')+'</table>'}},
deals:{label:'Deals',count:function(){return db.deals.filter(function(d){return d.status==='Pending'}).length},render:function(){
 var avail=db.cars.filter(function(c){return c.status!=='Sold'});
 return'<h2>Deals</h2><form class="row" data-form="deal"><select name="carId" required>'+opts(avail,function(c){return carName(c.id)+' · '+money(c.price)},'','Vehicle')+'</select><input name="buyer" placeholder="Buyer" required><input name="price" type="number" placeholder="Sale price" required><select name="staffId">'+opts(db.staff,function(s){return s.name},'')+'</select><button class="btn">Start deal</button></form>'+
 '<table><tr><th>Date</th><th>Vehicle</th><th>Buyer</th><th>Price</th><th>Tax</th><th>Total</th><th>Staff</th><th>Status</th><th></th></tr>'+db.deals.map(function(d){var tax=Math.round((+d.price||0)*db.settings.taxRate/100);return'<tr data-deal="'+esc(d.id)+'"><td>'+esc(d.date)+'</td><td>'+esc(carName(d.carId))+'</td><td>'+esc(d.buyer)+'</td><td>'+money(d.price)+'</td><td>'+money(tax)+'</td><td>'+money(+d.price+tax)+'</td><td>'+esc(staff(d.staffId))+'</td><td><span class="pill '+esc(d.status)+'">'+esc(d.status)+'</span></td><td>'+(d.status==='Pending'?'<button class="btn" data-act="closedeal" data-id="'+esc(d.id)+'">Close</button> <button class="btn ghost" data-act="lostdeal" data-id="'+esc(d.id)+'">Lost</button>':'')+'</td></tr>'}).join('')+'</table>'}},
staff:{label:'Staff',render:function(){return'<h2>Staff</h2><form class="row" data-form="staff"><input name="name" placeholder="Name" required><select name="role"><option>Sales</option><option>Sales Manager</option><option>Service Advisor</option><option>Finance</option></select><button class="btn">Add staff</button></form><table><tr><th>Name</th><th>Role</th><th>Deals closed</th><th></th></tr>'+db.staff.map(function(s){return'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.role)+'</td><td>'+db.deals.filter(function(d){return d.staffId===s.id&&d.status==='Closed'}).length+'</td><td><button class="btn ghost" data-act="delstaff" data-id="'+esc(s.id)+'">Remove</button></td></tr>'}).join('')+'</table>'}},
settings:{label:'Settings',render:function(){var s=db.settings;return'<h2>Settings</h2><form class="card" data-form="settings" style="max-width:460px;display:grid;gap:10px"><label>Dealership name<br><input name="dealer" value="'+esc(s.dealer)+'" style="width:100%"></label><label>Currency<br><select name="currency">'+['USD','CAD','EUR','GBP','BRL'].map(function(c){return'<option'+(c===s.currency?' selected':'')+'>'+c+'</option>'}).join('')+'</select></label><label>Sales tax %<br><input name="taxRate" type="number" step="0.01" value="'+esc(s.taxRate)+'"></label><label><input type="checkbox" name="sound"'+(s.sound?' checked':'')+'> Soft alert chime</label><div><button class="btn">Save settings</button> <button type="button" class="btn ghost" data-act="export">Export data</button> <button type="button" class="btn ghost" data-act="reset">Reset to sample data</button></div></form>'}}
};
var cur='dashboard';
function render(){document.getElementById('nav').innerHTML='<h1>'+esc(db.settings.dealer||'DealerDesk')+'</h1>'+Object.keys(views).map(function(k){var v=views[k],n=v.count?v.count():0;return'<button data-view="'+k+'"'+(k===cur?' class="on"':'')+'><span>'+v.label+'</span>'+(n?'<span class="badge">'+n+'</span>':'')+'</button>'}).join('');document.getElementById('main').innerHTML=views[cur].render();[].forEach.call(document.querySelectorAll('#main table'),function(t){if(t.rows.length<2){var r=t.insertRow(),c=r.insertCell();c.colSpan=t.rows[0].cells.length;c.className='empty';c.textContent='Nothing here yet.'}});
 if(cur==='leads'&&preCar){var sel=document.querySelector('[data-form=lead] [name=carId]');if(sel&&car(preCar))sel.value=preCar;var so=document.querySelector('[data-form=lead] [name=source]');if(so)so.value='QR';preCar=''}
 DD.emit('render',cur)}
function fd(f){var o={};new FormData(f).forEach(function(v,k){o[k]=typeof v==='string'?v.trim():v});return o}
var preCar='';
var add={car:function(o){db.cars.push({id:uid('c'),vin:o.vin.toUpperCase(),make:o.make,model:o.model,year:+o.year,price:+o.price||0,mileage:+o.mileage||0,status:'Available',photo:/^https:\/\//.test(o.photo)?o.photo:''})},
 lead:function(o){var dg=(o.phone||'').replace(/\D/g,'');if(o.phone&&(dg.length<7||dg.length>15||!/^[+0-9 ().-]+$/.test(o.phone))){toast('Enter a valid phone number');return false}DD.addLead(o)},booking:function(o){DD.addBooking(o)},
 deal:function(o){db.deals.push({id:uid('d'),carId:o.carId,buyer:o.buyer,price:+o.price,staffId:o.staffId,status:'Pending',date:new Date().toISOString().slice(0,10)});var c=car(o.carId);if(c)c.status='Pending'},
 staff:function(o){db.staff.push({id:uid('s'),name:o.name,role:o.role})},
 settings:function(o,f){db.settings.dealer=o.dealer||'DealerDesk';db.settings.currency=o.currency;db.settings.taxRate=Math.max(0,+o.taxRate||0);db.settings.sound=f.elements.sound.checked}};
document.addEventListener('submit',function(e){var f=e.target,k=f.getAttribute('data-form');if(!add[k])return;e.preventDefault();if(add[k](fd(f),f)===false)return;save();render();toast('Saved')});
document.addEventListener('change',function(e){var a=e.target.getAttribute('data-act'),id=e.target.getAttribute('data-id');if(a==='carstatus'){car(id).status=e.target.value}else if(a==='leadstatus'){db.leads.find(function(l){return l.id===id}).status=e.target.value}else return;save();render()});
document.addEventListener('click',function(e){var b=e.target.closest('[data-view],[data-act]');if(!b||b.tagName==='SELECT')return;var v=b.getAttribute('data-view');if(v){cur=v;render();return}
 var a=b.getAttribute('data-act'),id=b.getAttribute('data-id'),d;
 if(a==='closedeal'||a==='lostdeal'){d=db.deals.find(function(x){return x.id===id});d.status=a==='closedeal'?'Closed':'Lost';var c=car(d.carId);if(c)c.status=a==='closedeal'?'Sold':'Available'}
 else if(a==='delcar'){db.cars=db.cars.filter(function(c){return c.id!==id})}else if(a==='delbooking'){db.bookings=db.bookings.filter(function(x){return x.id!==id})}
 else if(a==='delstaff'){db.staff=db.staff.filter(function(x){return x.id!==id})}
 else if(a==='reset'){if(!window.confirm||window.confirm('Replace all data with sample data?')){db=sample()}}
 else if(a==='export'){var u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='dealerdesk-data.json';l.click();return}else return;save();render()});
/* Public hooks for crew modules (QR leads: coder 3, bookings: Coder 2). */
var subs={};
var DD=window.DealerDesk={get db(){return db},schema:schema,save:save,render:render,views:views,chime:chime,uid:uid,
 on:function(ev,fn){(subs[ev]=subs[ev]||[]).push(fn)},emit:function(ev,x){(subs[ev]||[]).forEach(function(fn){try{fn(x)}catch(e){}})},
 setSchema:function(s){schema=DD.schema=s;db=s.normalize(db);save();render()},
 registerView:function(k,v){views[k]=v;render()},
 addLead:function(o){var l={id:uid('l'),name:o.name,phone:o.phone||'',carId:o.carId||'',source:o.source||'Walk-in',status:'New',created:new Date().toISOString().slice(0,10)};db.leads.push(l);save();chime();DD.emit('lead',l);render();return l},
 addBooking:function(o){var b={id:uid('b'),type:o.type==='Service'?'Service':'Test drive',name:o.name,carId:o.carId||'',when:o.when,staffId:o.staffId||''};db.bookings.push(b);save();chime();DD.emit('booking',b);render();return b}};
// QR lead deep link: app.html#lead?car=<id>
if(/^#lead/.test(location.hash)){cur='leads';var m=/[?&]car=([^&]+)/.exec(location.hash);if(m)preCar=decodeURIComponent(m[1])}
render();if(db.firstRun){delete db.firstRun;save();toast('Sample data loaded. Reset anytime in Settings.')}
})();
</script></body></html>
